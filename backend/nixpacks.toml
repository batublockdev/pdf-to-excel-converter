[phases.setup]
nixPkgs = ['python311', 'python311Packages.pip']

[phases.install]
cmds = ['python -m venv /opt/venv', '/opt/venv/bin/pip install --upgrade pip', '/opt/venv/bin/pip install fastapi uvicorn[standard] python-multipart pdfplumber pandas openpyxl google-generativeai python-dotenv']

[start]
cmd = '/opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT'